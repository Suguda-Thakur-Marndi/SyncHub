version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: gpms-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: gpms_prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gpms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gpms-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      BASE_PATH: /api
      MONGO_URI: mongodb://mongodb:27017/gpms_prod
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-gpms_production_session_super_secret_key_change_me}
      SESSION_EXPIRES_IN: 1d
      FRONTEND_ORIGIN: http://localhost:80
      FRONTEND_GOOGLE_CALLBACK_URL: http://localhost:80/google/callback
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gpms-client
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
  redis_data:

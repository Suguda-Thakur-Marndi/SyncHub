name: GPMS 2.0 CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Test & Typecheck
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Vitest Automated Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5000
          BASE_PATH: /api
          MONGO_URI: mongodb://localhost:27017/gpms_test
          SESSION_SECRET: test_session_secret_key_1234567890
          SESSION_EXPIRES_IN: 1d
          GOOGLE_CLIENT_ID: mock_client_id
          GOOGLE_CLIENT_SECRET: mock_client_secret
          GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback
          FRONTEND_ORIGIN: http://localhost:5173
          FRONTEND_GOOGLE_CALLBACK_URL: http://localhost:5173/google/callback
        run: npm test

  frontend-ci:
    name: Frontend Build & Chunk Budget Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Frontend Production Build (Typecheck + Vite)
        working-directory: ./client
        run: npm run build

      - name: Verify Bundle Size Budget (< 650 kB Core Chunk)
        working-directory: ./client
        run: |
          ENTRY_SIZE=$(ls -l dist/assets/index-*.js | awk '{print $5}')
          MAX_SIZE=665600 # 650 kB
          echo "Main Entry Chunk Size: $ENTRY_SIZE bytes (Max Allowed: $MAX_SIZE bytes)"
          if [ $ENTRY_SIZE -gt $MAX_SIZE ]; then
            echo "ERROR: Main chunk size exceeded budget threshold!"
            exit 1
          fi
          echo "SUCCESS: Bundle size within production budget."
